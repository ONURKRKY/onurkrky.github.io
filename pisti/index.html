<body>
  <!-- Darkrock Studio Home Navigation Button -->
  <style>
    .darkrock-nav-btn {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 9999999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      height: 28px;
      box-sizing: border-box;
      background: rgba(22, 11, 4, 0.90);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(212, 175, 55, 0.6);
      border-radius: 20px;
      color: #ffe082;
      text-decoration: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55);
      opacity: 0.92;
      transition: all 0.2s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .darkrock-nav-btn:hover, .darkrock-nav-btn:active {
      opacity: 1;
      background: rgba(36, 20, 9, 0.98);
      border-color: #ffd54f;
      color: #ffffff;
      transform: scale(1.05);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.75);
    }
    .darkrock-nav-arrow {
      color: #ffd54f;
      font-size: 13px;
      font-weight: 900;
      line-height: 1;
    }
  </style>
  <a href="https://darkrockstudio.net/" class="darkrock-nav-btn" title="Darkrock Studio Ana Sayfasına Dön">
    <span class="darkrock-nav-arrow">&#8592;</span>
    <span>Stüdyo</span>
  </a>

  <!--

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization

</body>
